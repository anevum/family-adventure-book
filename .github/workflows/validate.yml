name: Validate Evergrove source and ANEVUM showcase
on:
  push:
    branches: [main]
  pull_request:
jobs:
  source-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/check-release.mjs
      - run: node tests/check-showcase.mjs
      - run: node --check dist-showcase/assets/app.js
      - uses: actions/upload-artifact@v4
        with:
          name: evergrove-anevum-showcase
          path: dist-showcase/
          retention-days: 14
          if-no-files-found: error

  browser-smoke:
    needs: source-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build-showcase.mjs
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/check-showcase-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evergrove-visual-qa
          path: qa/
          retention-days: 14
          if-no-files-found: warn
