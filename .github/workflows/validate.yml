name: Validate Adventure Book source
on:
  push:
    branches: [main]
  pull_request:
jobs:
  source-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/check-release.mjs
