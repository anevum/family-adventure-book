name: Verify fail-closed release gate (no deployment)
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-gate-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test release-gate denial and authorization policies
        run: node --test tests/verify-release-gate.test.mjs tests/main-ruleset.test.mjs
      - name: Verify source smoke test remains successful
        run: node tests/check-release.mjs
# This workflow never deploys. Cloudflare production trigger remains unchanged.
