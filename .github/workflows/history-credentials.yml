name: Adventure Book history credentials (verification only)
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  history-credential-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fetch current remote branches
        run: git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Verify synthetic deleted-token and binary fixtures
        run: python3 -m unittest scripts/test_scan_git_history.py
      - name: Scan available history
        run: python3 scripts/scan-git-history.py
# No deployment. Existing Cloudflare Builds trigger is not gated by this workflow.
